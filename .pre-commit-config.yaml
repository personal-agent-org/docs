# Run `prek install` once, plus `prek install --hook-type commit-msg`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
  - repo: local
    hooks:
      - id: website-check
        name: website check
        entry: pnpm check
        language: system
        pass_filenames: false
        files: ^(src/|docs/|package\.json|pnpm-lock\.yaml|quasar\.config\.ts)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
