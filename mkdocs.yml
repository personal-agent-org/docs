site_name: Personal Agent
site_description: >-
  A multi-tenant, self-hostable LLM chat + agent platform — durable runs,
  a world-state memory graph, devices, integrations and proactive work.
site_author: luebke.dev
site_url: https://personal-agent.org/

repo_name: luebke-dev/personal-assistant
repo_url: https://github.com/luebke-dev/personal-assistant
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 luebke.dev

docs_dir: docs

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/logo-header.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode (OLED-black, matching the product's design tokens)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/luebke-dev/personal-assistant
      name: Personal Agent on GitHub
  generator: false

plugins:
  - search
  - tags

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Run locally: getting-started/run-locally.md
  - User guide:
      - features/index.md
      - Chatting:
          - Chatting: features/chat.md
          - Controls & modes: features/chat-controls.md
          - Agents & autonomy: features/agents.md
          - Coding & Cloud Tasks: features/coding.md
      - What it knows:
          - Memory & entities: features/memory.md
          - Notes & Files: features/notes-files.md
      - Comms & calendar:
          - Inbox & contacts: features/inbox.md
          - Calendar & agenda: features/calendar.md
      - Automation & devices:
          - Workflows & automations: features/workflows.md
          - Dashboards & scenes: features/dashboards.md
          - Skills: features/skills.md
          - Integrations: features/integrations.md
          - Devices & apps: features/devices.md
      - Personalize:
          - Settings: features/settings.md
          - Security & privacy: features/security.md
  - Administration:
      - Admin console: features/admin.md
  - Operation:
      - Architecture: architecture/index.md
      - Frozen contracts: architecture/frozen-contracts.md
      - Self-hosting: self-hosting.md
      - FCM push setup: fcm-push-setup.md
  - Design notes:
      - design/index.md
      - Feature comparison: feature-comparison.md
      - Home Assistant adoption: home-assistant-adoption.md
      - Universal memory: universal-memory.md
      - TUI ↔ web parity: tui-web-parity.md
      - Implementation plan: implementation-plan.md
      - Sub-agents (durable): subagents-durable-followup.md
      - Device agents (durable): device-agents-durable-followup.md
      - Android app plan: personal-agent-android-app-plan.md
      - Android expansion plan: personal-agent-android-expansion-plan.md
