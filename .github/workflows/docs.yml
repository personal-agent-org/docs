name: Website

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - quasar.config.ts
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - quasar.config.ts
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
