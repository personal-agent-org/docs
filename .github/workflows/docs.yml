name: Website

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
    paths:
      - docs/**
      - public/**
      - scripts/**
      - src/**
      - src-ssg/**
      - Containerfile
      - deploy/**
      - index.html
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - quasar.config.ts
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - public/**
      - scripts/**
      - src/**
      - src-ssg/**
      - index.html
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - quasar.config.ts
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  container:
    name: publish container
    needs: check
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CalVer tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "Release tags must use CalVer: YEAR.MONTH.MINOR"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/personal-agent-org/website
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the website image
        run: >-
          cosign sign --yes --recursive
          ghcr.io/personal-agent-org/website@${{ steps.build.outputs.digest }}
      - name: Create signed GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "version=$GITHUB_REF_NAME"
            echo "image=ghcr.io/personal-agent-org/website@${{ steps.build.outputs.digest }}"
          } > RELEASE-MANIFEST
          cosign sign-blob --yes --bundle RELEASE-MANIFEST.sigstore.json RELEASE-MANIFEST
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            RELEASE-MANIFEST RELEASE-MANIFEST.sigstore.json
